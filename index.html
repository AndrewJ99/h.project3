<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Scrapbook</title>
  <meta name="description" content="A handmade scrapbook of our year together." />

  <!-- Typography: a modern serif for headings, a softer serif for body.
       (photos.js can swap these out via theme.googleFonts.) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Very soft drifting hearts in the white space. Populated by script.js. -->
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <!-- Top bar: title + controls ------------------------------------------- -->
  <header class="topbar">
    <p class="brand" id="brand">Our Scrapbook</p>
    <div class="controls">
      <button class="ctrl" id="layoutToggle" type="button" title="Switch between one photo and four photos per page">
        <span class="ctrl-glyph" id="layoutGlyph">▦</span>
        <span class="ctrl-label" id="layoutLabel">4 per page</span>
      </button>
    </div>
  </header>

  <!-- The stage: arrows + the book ---------------------------------------- -->
  <main class="stage">
    <button class="nav nav--prev" id="navPrev" type="button" aria-label="Previous page">
      <span>&#8249;</span>
    </button>

    <div class="book-wrap" id="bookWrap">
      <!-- The book itself. Leaves are injected by script.js. -->
      <div class="book book--closed-front" id="book">
        <!-- Decorative stacked-page edges so a closed book has thickness. -->
        <div class="book-edge book-edge--right" aria-hidden="true"></div>
        <div class="book-edge book-edge--bottom" aria-hidden="true"></div>
        <!-- .leaf elements go here -->
      </div>
      <!-- Soft contact shadow under the book. -->
      <div class="book-shadow" aria-hidden="true"></div>
    </div>

    <button class="nav nav--next" id="navNext" type="button" aria-label="Next page">
      <span>&#8250;</span>
    </button>
  </main>

  <!-- Footer: hint + restart + page indicator ----------------------------- -->
  <footer class="footbar">
    <p class="hint" id="hint">Click the cover, or drag a page across &#8594;</p>
    <button class="ctrl ctrl--restart" id="restartBtn" type="button" title="Back to the cover" aria-label="Back to the cover">
      <span class="ctrl-glyph" aria-hidden="true">&#8634;</span>
      <span class="ctrl-label">Back to cover</span>
    </button>
    <p class="page-indicator" id="pageIndicator"></p>
  </footer>

  <!-- Pop-out lightbox ----------------------------------------------------- -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>

    <button class="lightbox-nav lightbox-nav--prev" id="lbPrev" type="button" aria-label="Previous photo">
      <span>&#8249;</span>
    </button>

    <div class="lightbox-frame" id="lightboxFrame" role="dialog" aria-modal="true" aria-label="Photo">
      <figure class="lightbox-photo">
        <img id="lightboxImg" alt="" decoding="async" />
      </figure>
      <aside class="lightbox-note">
        <p class="lightbox-date" id="lightboxDate"></p>
        <div class="lightbox-rule" aria-hidden="true"></div>
        <p class="lightbox-text" id="lightboxText"></p>
        <p class="lightbox-count" id="lightboxCount"></p>
      </aside>
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">&#215;</button>
    </div>

    <button class="lightbox-nav lightbox-nav--next" id="lbNext" type="button" aria-label="Next photo">
      <span>&#8250;</span>
    </button>
  </div>

  <!-- Config first, then the engine. -->
  <script src="photos.js"></script>
  <script src="script.js"></script>
</body>
</html>
